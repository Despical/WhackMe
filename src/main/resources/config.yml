game-settings:
  # If enabled, players in a game can only use commands permitted below.
  block-commands: true

  # If enabled, the in-game leave command is blocked by the command policy.
  block-leave-command: false

  # Duration, in seconds, of each Whack Me game.
  gameplay-time: 30

  # Cooldown, in seconds, before a player can join another game.
  # Set this to 0 to disable the cooldown.
  cooldown-seconds: 0

# If enabled, players see the config-driven scoreboard while playing.
# Arenas can still disable their own scoreboard separately.
scoreboard-enabled: true

chat-settings:
  # Whether the plugin should format arena chat using messages.yml formats.
  # If disabled, Minecraft's standard chat formatting is used.
  enable-formatting: true

  # When enabled, arena chat is isolated from players outside the arena.
  separate-chat: true

  # When enabled, players who are actively in a game cannot send chat messages.
  disable-chat-in-game: false

database:
  # If enabled, player statistics are stored in MySQL instead of flat files.
  # Configure the connection details in mysql.yml before enabling this option.
  enabled: false

command-settings:
  # Commands players may still use while playing when command blocking is enabled.
  # Use command roots such as "me" to permit the command with any arguments.
  allowed-commands:
    - "me"
    - "help"

# The permission a player must have to join a game.
# Leave this empty to allow every player to join.
join-permission: ""

update-notifier:
  # If enabled, the plugin checks for newer releases on startup.
  enabled: true

# Enabling debug mode gives administrators access to advanced troubleshooting commands.
# Keep this disabled on production servers unless you are diagnosing an issue.
debug: false

# Event profiling measures how long Whack Me event listeners take to execute.
# It is useful for diagnosing lag, but is normally unnecessary during regular gameplay.
event-profiling:
  enabled: false

  # If enabled, every profiled event execution is logged with timing details.
  # This can heavily spam the console, so only enable it for short diagnostics.
  verbose: false
