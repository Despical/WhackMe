# Point block settings.
point-blocks:
  # Entity removal is still going to be executed in main thread.
  # This option may decrease the amount of lag if there are multiple
  # instances running at the same time.
  run-async: false
  # Period of point handler thread. If you decrease that value the blocks
  # will move faster and if you increase the period then they'll move slower.
  # This option should be edited considering Y multiplier.
  # Best way to make blocks move faster is increasing multiplier below.
  ticks: 8
  # Point blocks are maximum raised by total of 0.65 in Y axis.
  y-multiplier: 0.05
  # Max Y multiplier for point blocks.
  max-y-multiplier: 0.64
  # How many milliseconds should any point block wait in the air?
  wait-milliseconds: 12
  # Point blocks can be rotated around the vertical axis.
  rotations:
    # Values below are represented to yaw of point blocks in the game.
    punch-me: "0:0:0:0:0:0:0:0"
    dont-punch-me: "0:0:0:0:0:0:0:0"
    ouch: "0:0:0:0:0:0:0:0"
# Game settings
game-settings:
  # Should we block every not Whack Me associated commands in game?
  block-commands: true
  # Should we block the in-game leave command?
  block-leave-command: false
  # The gameplay time for each arena. Default is 30 seconds.
  gameplay-time: 30
  # Should players wait a certain amount of time before playing again Whack Me? (in seconds)
  cooldown-seconds: 0
  # 20 = no hit cooldown, 4 is the default value.
  # The smaller value the slower hits.
  hit-cooldown-delay: 20

# Display the config-driven in-game scoreboard from scoreboard.yml.
scoreboard-enabled: true

# Should we format the chat messages?
# See messages.yml to change format.
chat-settings:
  disable-chat-in-game: false
  enable-formatting: true
  # Keep game chat isolated from players outside the arena.
  separate-chat: true

# Player settings
player-settings:
  # Should we clear player's active potion effects when player join the arena?
  clear-effects-on-join: true
  # Should we clear player's inventory on join and after leaving the game area?
  # Also disable inventory manager option above before enabling this option.
  clear-inventory-on-join: true

# Should we enable our MySQL support?
# See mysql.yml for detailed information.
database:
  enabled: false

# Enable Inventory Manager for your games? (VERY USEFUL feature for MULTI ARENA)
# This saves inventory of players and restores it after player leaves arena.
# Saved elements: max health, health, food, experience, full inventory, armor contents, and more.
inventory-manager:
  enabled: true
  # Usable attributes:
  #  game-mode, hunger, exp, level
  #  health, max-health, health-scale
  #  saturation, allow-flight, fire-ticks
  do-not-restore:
    - "max-health"
    - "health-scale"

# Should we check for updates on plugin start and after any admin join?
update-notifier:
  enabled: true

# Commands which can be used in game, remove all of them to disable.
whitelisted-commands:
  - me
  - help

# The permission that player needs to join to game.
# Leave the section empty if you don't want to set.
join-permission: ""

