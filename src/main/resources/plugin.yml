name: WhackMe
main: me.despical.whackme.Main
author: Despical
version: ${project.version}
api-version: 1.13
softdepend: [ Multiverse-Core, PlaceholderAPI ]

permissions:
  wm.admin.*:
    default: op
    children:
      wm.update: true
      wm.admin: true
      wm.admin.create: true
      wm.admin.delete: true
      wm.admin.edit: true
      wm.admin.list: true
      wm.admin.help: true
      wm.admin.reload: true
      wm.admin.kick: true