# =============================================================== #
#                   Whack Me - Sounds Configuration               #
# =============================================================== #

sounds:
  # Plays when a player successfully hits a rewarding green point block.
  point:
    enabled: true
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 2.0

  # Plays when a player hits a harmful red point block and loses points.
  minus-point:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 1.0

  # Plays when a player hits a neutral point block that should be avoided.
  ouch:
    enabled: true
    sound: ""
    volume: 1.0
    pitch: 1.0

  # Plays when a game ends without the player setting a new arena record.
  game-finished:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.35

  # Plays when a player finishes a game with a new arena record.
  record-broken:
    enabled: true
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
