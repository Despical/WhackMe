title: "<gradient:#FF5252:#D50000><bold>GAME SETUP</bold></gradient> <dark_gray><bold>></bold></dark_gray> <gold><bold>%arena_id%</bold>"

point-block-settings-dialog:
  title: "<gradient:#FFCA28:#FF7043><bold>Point Block Settings</bold></gradient>"
  external-title: "<gold>Point Blocks <dark_gray>• <yellow>%arena_id%"
  description: "<#FFCA28><bold>Select a setting</bold> <gray>to edit for <white>%arena_id%</white>.<newline><gray>Every value below is stored separately for this arena."
  enabled-value: "Enabled"
  disabled-value: "Disabled"
  groups:
    active-blocks:
      title: "<#FFB300><bold>Active Block Limits"
      description: "<#FFB300><bold>Minimum</bold><newline><gray>The lowest amount kept visible.<newline><newline><#FF7043><bold>Maximum</bold><newline><gray>The hard limit, capped by portal count."
    vertical-movement:
      title: "<#66BB6A><bold>Vertical Movement"
      description: "<#66BB6A><bold>Movement Step</bold><newline><gray>Controls how quickly blocks move.<newline><newline><#26C6DA><bold>Maximum Step</bold><newline><gray>Sets the safety cap for that speed."
  options:
    minimum-points:
      title: "<#FFB300><bold>Minimum Active Blocks"
      description: "<gray>The lowest number of point blocks the arena tries to keep visible. This value cannot exceed the arena's portal count."
      input-label: "<#FFB300><bold>Minimum"
    maximum-points:
      title: "<#FF7043><bold>Maximum Active Blocks"
      description: "<gray>The hard limit for simultaneously active point blocks. This value is capped by the arena's portal count."
      input-label: "<#FF7043><bold>Maximum"
    y-multiplier:
      title: "<#66BB6A><bold>Vertical Movement Step"
      description: "<gray>Controls how far a point block moves vertically each tick. Higher values make blocks rise and fall faster."
      input-label: "<#66BB6A><bold>Step"
    max-y-multiplier:
      title: "<#26C6DA><bold>Maximum Vertical Step"
      description: "<gray>Sets the safety cap applied to vertical movement speed. The movement step cannot exceed this value."
      input-label: "<#26C6DA><bold>Maximum"
    wait-ticks:
      title: "<#AB47BC><bold>Peak Wait"
      description: "<gray>Controls how many <#AB47BC><bold>ticks</bold> <gray>a point block remains <#FFCA28>fully visible <gray>before it starts descending."
      input-label: "<#AB47BC><bold>Peak Wait"
    handler-ticks:
      title: "<#42A5F5><bold>Spawn Check Period"
      description: "<gray>Sets the <#42A5F5><bold>delay in ticks</bold> <gray>between spawn checks. <#00E676>Lower values <gray>replace missing blocks more frequently."
      input-label: "<#42A5F5><bold>Period"
    run-async:
      title: "<#EF5350><bold>Asynchronous Movement"
      description: "<gray>Moves point blocks outside the <#EF5350><bold>main thread</bold> <gray>to reduce its workload. <#FFCA28>Entity cleanup <gray>always remains synchronous."
      input-label: "<#EF5350><bold>Enabled"
  buttons:
    save:
      label: "<#00E676><bold>Save"
      tooltip: "<gray>Apply this value and return to point block settings."
    back:
      label: "<#FFCA28><bold>Back"
      tooltip: "<gray>Discard this change and return to point block settings."
    exit:
      label: "<#FF5252><bold>Back to Setup"
      tooltip: "<gray>Return to the arena setup menu."
    appearance:
      label: "<#90CAF9><bold>Customize Point Block Looks"
      tooltip: "<gray>Open the inventory menu for green, red, and hit-state block items."

items:
  game-locations:
    name: "<#4DD0E1><bold>Manage Arena Locations"
    material: FILLED_MAP
    lore:
      - "<#2F2F2F>• <#26C6DA>CLICK <#BDBDBD>to open location settings"
      - ""
      - "<#2F2F2F>• <#B0BEC5>Configure the start and end"
      - "<#B0BEC5>  positions used by this arena."

  portal-layout:
    name: "<#BA68C8><bold>Manage Portal Layout"
    material: ENDER_PEARL
    enter-editing-message: "<#57C5F7>ℹ <#BDBDBD>You entered <#BA68C8>Portal Editing Mode<#BDBDBD>."
    leave-editing-message: "<#57C5F7>ℹ <#BDBDBD>You left <#BA68C8>Portal Editing Mode<#BDBDBD>."
    lore:
      - "<#2F2F2F>• <#AB47BC>CLICK <#BDBDBD>to toggle editor mode"
      - ""
      - "<#2F2F2F>• <#B0BEC5>Place or break portal frames to"
      - "<#B0BEC5>  define the active play ring."

  start:
    name: "<#00E676><bold>Set Start Location"
    material: BEACON
    message: "<#57C5F7>ℹ <#00E676>Start Location <#BDBDBD>has been set successfully."
    invalid-message: "<#FF5252>⚠ <#FF5252>Invalid start location! <#BDBDBD>Ensure you are surrounded by <#FFB74D>End Portal Frames <#BDBDBD>or enable <#BA68C8>Portal Layout Mode<#BDBDBD> via setup menu."
    lore:
      - "<#2F2F2F>• <#43A047>CLICK <#BDBDBD>to set at <#66BB6A>your pos"
      - "<#2F2F2F>• <#2E7D32>SHIFT-CLICK <#BDBDBD>to auto-place <#A5D6A7>portal frames"
      - ""
      - "<#2F2F2F>• <#B0BEC5>Defines where the active round starts"
      - "<#B0BEC5>  for the player."

  end:
    name: "<#E040FB><bold>Set End Location"
    material: END_PORTAL_FRAME
    message: "<#57C5F7>ℹ <#E040FB>End Location <#BDBDBD>has been set successfully."
    lore:
      - "<#2F2F2F>• <#D500F9>CLICK <#BDBDBD>to set at <#EA80FC>your pos"
      - "<#2F2F2F>• <#B388FF>SHIFT-CLICK <#BDBDBD>to <#F8BBD0>center block"
      - ""
      - "<#2F2F2F>• <#B0BEC5>Used as the exit point after"
      - "<#B0BEC5>  the game has been completed."

  point-blocks:
    name: "<#FFAB00><bold>Point Block Settings"
    material: LIME_TERRACOTTA
    lore: []

  point-blocks-locked:
    name: "<#FF5252><bold>Point Block Settings"
    material: BARRIER
    message: "<#FF5252>⚠ <#BDBDBD>You need to set <#BA68C8>portal locations <#BDBDBD>before editing point block amounts."
    lore: []

  point-block-appearance:
    name: "<#90CAF9><bold>Customize Point Block Looks"
    material: LIME_TERRACOTTA
    green-name: "<!i><#00E676><bold>Green Block"
    red-name: "<!i><#FF5252><bold>Red Block"
    gray-name: "<!i><#B0BEC5><bold>Gray Block"
    missing-cursor: "<#FF5252>⚠ <#FF5252>No item detected! <#BDBDBD>Hold an item on your cursor <#BDBDBD>and click this slot again."
    updated-message: "<#57C5F7>ℹ <#BDBDBD>Updated %block_name% <#BDBDBD>for arena <#90CAF9>%arena_id%<#BDBDBD>."
    preview-lore:
      - "<!i><#2F2F2F>• <#64B5F6>CLICK <#BDBDBD>with an item on your cursor"
      - "<!i><#BDBDBD>  to save it for this arena"
      - ""
      - "<!i><#2F2F2F>• <#B0BEC5>Supports blocks, skulls and custom"
      - "<!i><#B0BEC5>  custom item meta."
    lore:
      - "<!i><#2F2F2F>• <#64B5F6>CLICK <#BDBDBD>to edit arena visuals"
      - ""
      - "<!i><#2F2F2F>• <#B0BEC5>Assign custom items for the green,"
      - "<!i><#B0BEC5>  red, and gray point block states."

  other-settings:
    name: "<#7E57C2><bold>Other Arena Settings"
    material: BOOK
    lore:
      - "<#2F2F2F>• <#9575CD>CLICK <#BDBDBD>to manage display settings"
      - ""
      - "<#2F2F2F>• <#B0BEC5>Configure the arena scoreboard"
      - "<#B0BEC5>  and boss bar separately."

  scoreboard-toggle:
    name: "<#00BCD4><bold>Arena Scoreboard"
    material: NAME_TAG
    lore:
      - "<#2F2F2F>• <#2196F3>CLICK <#BDBDBD>to toggle"
      - ""
      - "<#2F2F2F>• <#B0BEC5>Status: %scoreboard_status%"
      - ""
      - "<#B0BEC5>Show the in-game scoreboard"
      - "<#B0BEC5>for players in this arena."

  bossbar-toggle:
    name: "<#FF7043><bold>Arena Boss Bar"
    material: ORANGE_DYE
    lore:
      - "<#2F2F2F>• <#2196F3>CLICK <#BDBDBD>to toggle"
      - ""
      - "<#2F2F2F>• <#B0BEC5>Status: %bossbar_status%"
      - ""
      - "<#B0BEC5>Show the configured boss bar"
      - "<#B0BEC5>for players in this arena."

  arena-record-reset:
    name: "<#FF5252><bold>Reset Arena Record"
    material: PLAYER_HEAD
    lore:
      - "<#2F2F2F>• <#FF5252>CLICK <#BDBDBD>to open confirmation"
      - ""
      - "<#2F2F2F>• <#B0BEC5>Record Holder: <#81D4FA>%record_holder%"
      - "<#2F2F2F>• <#B0BEC5>Record Score: <#FFD54F>%record_score%"
      - ""
      - "<#EF9A9A>Clears only this arena's"
      - "<#EF9A9A>record holder and score."

  confirm-arena-record-reset:
    name: "<#00E676><bold>Confirm Reset"
    material: LIME_DYE
    message: "<#00E676>✔ <#BDBDBD>The record for arena <#29B6F6><bold>%arena_id%</bold> <#BDBDBD>has been reset."
    lore:
      - "<#2F2F2F>• <#00E676>CLICK <#BDBDBD>to permanently clear"
      - "<#BDBDBD>  this arena's record."

  cancel-arena-record-reset:
    name: "<#FF5252><bold>Cancel"
    material: RED_DYE
    lore:
      - "<#2F2F2F>• <#FF5252>CLICK <#BDBDBD>to return without"
      - "<#BDBDBD>  changing the arena record."

  song-selector:
    name: "<#9C27B0><bold>Select Arena Music"
    material: MUSIC_DISC_BLOCKS
    lore:
      - "<#2F2F2F>• <#AB47BC>CLICK <#BDBDBD>to open song selector"
      - ""
      - "<#2F2F2F>• <#B0BEC5>Choose a song to play when"
      - "<#B0BEC5>  players join the arena."
      - ""
      - "<#2F2F2F>• <#B0BEC5>Currently Selected: <#CE93D8>%selected_song%"
    item-flags:
      - HIDE_ADDITIONAL_TOOLTIP

  song-no-selection:
    name: "<#FF5252>No Song"
    material: BARRIER
    lore:
      - "<#B0BEC5>• <#00E676>LEFT <white>click to select"
      - ""
      - "<#B0BEC5>• <#B0BEC5>Arena will play no music."
    item-flags:
      - HIDE_ADDITIONAL_TOOLTIP

  song-item:
    name: "<bold><#FFB300>♪ <#76FF03>%song_name%</bold>"
    material: MUSIC_DISC_BLOCKS
    lore:
      - "<#81C784>• <#64B5F6>LEFT <#FFFFFF>click to select"
      - "<#81C784>• <#FFB300>RIGHT <#FFFFFF>click to preview"
      - ""
      - "<#90CAF9>• <#90CAF9>This song will play when players"
      - "<#90CAF9>join the arena."
    item-flags:
      - HIDE_ADDITIONAL_TOOLTIP

  song-nbs-not-installed:
    name: "<#FF5252><bold>NoteBlockAPI Not Installed"
    material: BARRIER
    lore:
      - ""
      - "<#FF9800>⚠ <bold><#FFFFFF>NoteBlockAPI not found!"
      - ""
      - "<#90CAF9><bold>To enable music selection:"
      - "<#81C784>    1. <#B0BEC5>Install <#76FF03>NoteBlockAPI <#B0BEC5>plugin"
      - "<#81C784>    2. <#B0BEC5>Place <#FFD54F>.nbs <#B0BEC5>files in <#FFD54F>musics/ <#B0BEC5>folder"
      - "<#81C784>    3. <#B0BEC5>Restart the server"
      - ""
      - "<#FFC107><underlined>github.com/xxmicloxx/NoteBlockAPI</underlined>"
    item-flags:
      - HIDE_ADDITIONAL_TOOLTIP

  arena-sign:
    name: "<#FFAB00><bold>Create Arena Sign"
    material: OAK_SIGN
    lore: []

  register-arena:
    name: "<#00E676><bold>Register the Arena"
    material: FIREWORK
    hide-tooltip: true
    missing-option:
      - "<#37474F><st>                                                                                 </st>"
      - "<#FF5252><bold>REGISTRATION FAILED"
      - ""
      - "<gray>The arena configuration integrity check has failed."
      - "<gray>A mandatory configuration value is missing."
      - ""
      - "<gray>Missing arena option: <#FFD54F>%option%"
      - ""
      - "<#37474F><st>                                                                                 </st>"
    registered-successfully:
      - "<#37474F><st>                                                                                 </st>"
      - "<gradient:#00E676:#1DE9B6><bold>REGISTRATION COMPLETE</gradient>"
      - ""
      - "<#CFD8DC>The arena '<#00B0FF>%arena_id%<#CFD8DC>' has been successfully registered."
      - ""
      - "<click:run_command:%command%><hover:show_text:'<#69F0AE>Click to join instantly.'><#FFD740><bold><underlined>CLICK HERE TO JOIN & PLAY</underlined></bold></hover></click>"
      - ""
      - "<#37474F><st>                                                                                </st>"

  go-back:
    name: "<#FF5252><bold>Return to Last Page"
    material: ARROW
