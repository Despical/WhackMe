# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#                                                                                                                     #
#                                           Whack Me Rewards Configuration                                            #
#                                                                                                                     #
#                                                 Placeholders List                                                   #
#                                                                                                                     #
#                                             %arena% - Arena identifier                                              #
#                                           %player% - Current player name                                            #
#                                         %points% - Number of player's score                                         #
#                           %point_streak% - Current point streak of player in current game                           #
#                       %longest_point_streak% - Longest point streak of player in current game                       #
#                                                                                                                     #
#                 Commands are executed by default by CONSOLE, use "p:" to preform command by player .                #
#        Use points conditions to execute commands if player gets more than a specific point; "points(NUMBER):"       #
#   Use chance conditions to execute command with a chance, by adding "chance(NUMBER):" at the beginning of command   #
#                                                                                                                     #
#  Commands examples:                                                                                                 #
#    - p:say Hello everyone in %arena%!   =====>  Player will say "Hello everyone in <arena name here>"               #
#    - broadcast Game %arena% has ended!  =====>  Will broadcast "Game <arena name here> has ended" message           #
#    - chance(1):p:say I was very lucky!  =====>  Player has 1% chance to say "I was very lucky!"                     #
#    - p:chance(99):spawn                 =====>  Player has 99% chance to teleport to spawn                          #
#    - chance(50):eco give %player% 10    =====>  Console has 50% chance to give player $10                           #
#    - points(20):eco give %player% 50    =====>  Player will receive $50 if they get more than 20 points.            #
#                                                                                                                     #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

# Should rewards be enabled?
rewards-enabled: true

rewards:

  # The rewards performed when player clicked on right point block.
  successful-point:
    - p:say yey, +1 point! (disable this message via rewards.yml)

  # The rewards performed when player clicked on a wrong point block.
  wrong-point:
    - p:say I shouldn't click this one!

  # The rewards performed on a successful game end (when the timer reaches 0).
  end-game:
    - p:say I whacked %points% blocks!

  # The rewards performed when player beats their highest score.
  new-record:
    - p:say I beat my highest score!