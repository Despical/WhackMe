plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.0'
}

group = 'dev.despical'
version = '1.8.9'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public' }
    maven { url = 'https://repo.extendedclip.com/releases' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly 'com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.7'
    compileOnly 'org.projectlombok:lombok:1.18.40'

    implementation('dev.despical:commons:2.1.0') {
        exclude group: 'org.slf4j'
    }
    implementation 'dev.despical:command-framework:1.6.2'
    implementation 'dev.despical:inventory-framework:2.4.7'
    implementation 'org.bstats:bstats-bukkit:3.1.0'

    annotationProcessor 'org.projectlombok:lombok:1.18.40'
}

tasks.processResources {
    def props = [version: version]
    inputs.properties props

    filteringCharset = 'UTF-8'

    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.jar {
    enabled = false
}

tasks.shadowJar {
    minimize()

    relocate 'dev.despical.commons', 'dev.despical.whackme.lib.commons'
    relocate 'dev.despical.commandframework', 'dev.despical.whackme.lib.commandframework'
    relocate 'dev.despical.inventoryframework', 'dev.despical.whackme.lib.inventoryframework'
    relocate 'dev.despical.particle', 'dev.despical.whackme.lib.particlelib'
    relocate 'org.bstats', 'dev.despical.whackme.lib.bstats'

    exclude 'META-INF/**'
    exclude 'fonts/**'

    archiveFileName = "whack-me-${version}.jar"

    def hostName = InetAddress.getLocalHost().getHostName()
    if (hostName == "DESKTOP-RD26J35") {
        destinationDirectory = file("C:\\Users\\berke\\OneDrive\\Masaüstü\\Paper 1.21.11\\plugins")
    }
}
